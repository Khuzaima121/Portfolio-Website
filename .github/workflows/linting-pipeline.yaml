name: Lint HTML and CSS

on:
  push:
    branches:
      - develop  # Trigger on push to the develop branch
  pull_request:
    branches:
      - develop  # Trigger on pull requests to the develop branch

jobs:
  lint:
    runs-on: ubuntu-latest  # Use an Ubuntu runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16  # Specify the Node.js version

      - name: Install dependencies
        run: |
          npm install --save-dev htmlhint stylelint  # Install HTMLHint and Stylelint

      - name: Lint HTML files with HTMLHint
        run: npx htmlhint "**/*.html"  # Adjust the glob pattern if needed

      - name: Lint CSS files with Stylelint
        run: npx stylelint "**/*.css"  # Adjust the glob pattern if needed
